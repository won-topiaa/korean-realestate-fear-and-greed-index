name: 원자료 캐시 유지

# KB·네이버 원자료는 저장소에 올리지 않고 Actions 캐시에만 둔다.
# GitHub는 7일 넘게 안 쓴 캐시를 지우므로, 월간 갱신 사이에 며칠마다 한 번씩 꺼내 써서 살려 둔다.
# (캐시가 살아 있어야 KB·주가 받기가 실패한 달에 지난 자료로 계속할 수 있다)
# 감시도 겸한다: 21일 이후인데 이번 달 월간 갱신이 안 됐고 돌고 있지도 않으면 다시 실행하고 이슈로 알린다.
on:
  schedule:
    - cron: "41 2 */4 * *"   # 4일마다
  workflow_dispatch:

permissions:
  contents: read

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 지난 원자료 캐시 꺼내기
        id: c
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/kb
            data/raw/market
          key: raw-keepalive-${{ github.run_id }}
          restore-keys: raw-
      - name: 결과
        run: |
          echo "캐시 복원: ${{ steps.c.outputs.cache-matched-key || '없음' }}"
          ls data/raw/kb 2>/dev/null | wc -l

  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write   # 월간 갱신 다시 실행
      issues: write    # 알림
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automation
      - name: 이번 달 월간 갱신 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(bash automation/monthly_due.sh)
          echo "이번 달 월간 갱신: $state"
          [ "$state" = due ] || exit 0
          gh workflow run monthly-update.yml -R "$GITHUB_REPOSITORY" --ref main
          month=$(TZ=Asia/Seoul date +%Y-%m)
          title="월간 자동 갱신 확인 필요 ($month)"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq length)
          if [ "$open" = 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "@${{ github.repository_owner }} 20일 이후 이번 달($month) 월간 자동 갱신이 아직 끝나지 않았어요 (예약이 빠졌거나 실패했거나, 자료가 덜 들어옴). 감시가 월간 갱신을 다시 실행했어요.
          - 자료가 덜 들어왔다면 results_zone/update_summary.json의 stale_votes(지난 값을 이어 쓴 표)·failed_sources(실패한 자료처)에 있어요.

          - 실행 목록: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/monthly-update.yml
          - 실패했다면 그 실행의 Summary에 단계별 결과가 있어요.
          - 갱신이 성공하면 이 이슈를 닫아 주세요."
          fi
