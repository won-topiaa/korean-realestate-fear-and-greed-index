name: 원자료 캐시 유지

# KB·네이버 원자료는 저장소에 올리지 않고 Actions 캐시에만 둔다.
# GitHub는 7일 넘게 안 쓴 캐시를 지우므로, 월간 갱신 사이에 이틀마다 꺼내 써서 살려 둔다 (예전 4일마다는 예약이 한 번만 빠져도 8일이 돼 지워질 수 있었음).
# 캐시가 없으면 이슈로 알린다 (다음 월간 갱신이 새로 받아 다시 만들지만, 그달 KB 받기까지 실패하면 지난 자료로 이어 갈 수 없음).
# (캐시가 살아 있어야 KB·주가 받기가 실패한 달에 지난 자료로 계속할 수 있다)
# 감시도 겸한다 (이틀마다라 21·23·25일…): 21일 이후인데 이번 달 월간 갱신이 안 됐고 돌고 있지도 않으면 다시 실행하고 이슈로 알린다.
on:
  schedule:
    - cron: "41 2 */2 * *"   # 이틀마다 (홀수 날)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write   # 캐시가 없으면 알림
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automation
      - name: 지난 원자료 캐시 꺼내기
        id: c
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/kb
            data/raw/market
          key: raw-keepalive-${{ github.run_id }}
          restore-keys: raw-
      - name: 결과
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "캐시 복원: ${{ steps.c.outputs.cache-matched-key || '없음' }}"
          n=$(ls data/raw/kb 2>/dev/null | wc -l)
          echo "KB 원자료 파일 $n개"
          if [ -z "${{ steps.c.outputs.cache-matched-key }}" ] || [ "$n" = 0 ]; then
            bash automation/issue.sh open "원자료 캐시가 없어요" "$(TZ=Asia/Seoul date +%m-%d) KB·네이버 원자료 캐시를 찾지 못했어요. 다음 월간 갱신이 새로 받아 다시 만들지만, 그달 KB 받기까지 실패하면 지난 자료로 이어 갈 수 없어요. 다음 월간 갱신(20일)이 성공했는지 확인해 주세요."
            exit 1
          fi
          bash automation/issue.sh close "원자료 캐시가 없어요" "캐시가 다시 생겼어요 (자동으로 닫음)" || true
