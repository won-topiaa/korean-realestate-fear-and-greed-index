name: 월간 갱신 정시 출발

# GitHub 예약 실행은 몇 시간씩 늦게 뜬다 (2026-10-20: 09:17 예약이 13:44, 15:43 예약이 21:09에 시작).
# 그래서 하루 전부터 이 작업이 미리 떠서 기다리다가 20일 09:10(한국 시간)에 월간 자동 갱신을 직접 부른다.
# 직접 부르기(workflow_dispatch)는 예약과 달리 바로 시작된다.
# 한 번에 최대 5시간 30분만 기다릴 수 있어서(작업 시간 한도 6시간), 더 남았으면 기다린 뒤 자기 자신을 다시 불러 이어서 기다린다.
# 예약 세 개 중 먼저 뜬 것이 기다리고, 나머지는 같은 묶음에서 차례를 기다리다 (이미 갱신이 됐거나 돌고 있으면) 바로 끝난다.
# 월간 자동 갱신 쪽 예약(monthly-update.yml)도 그대로 두어, 이 작업이 빠져도 늦게라도 돈다.
on:
  schedule:
    - cron: "41 18 18 * *"   # 19일 03:41 KST
    - cron: "41 2 19 * *"    # 19일 11:41 KST
    - cron: "41 10 19 * *"   # 19일 19:41 KST
  workflow_dispatch:         # 기다림 이어가기 (자기 자신이 부름) · 시험

permissions:
  contents: read
  actions: write   # 월간 자동 갱신·자기 자신 부르기

concurrency:
  group: monthly-kick
  cancel-in-progress: false

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automation
      - name: 20일 09:10 (한국 시간)까지 기다렸다가 월간 자동 갱신 부르기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TZ=Asia/Seoul
          day=$(date +%d)
          if (( 10#$day < 18 || 10#$day > 20 )); then echo "18~20일이 아니라 끝 (월간 갱신 쪽 예약·감시가 맡음)"; exit 0; fi
          target=$(date -d "$(date +%Y-%m)-20 09:10" +%s)
          left=$(( target - $(date +%s) ))
          if (( left > 330 * 60 )); then
            echo "20일 09:10까지 $((left / 60))분 — 330분 기다린 뒤 이어서 기다리기"
            sleep $(( 330 * 60 ))
            gh workflow run monthly-kick.yml -R "$GITHUB_REPOSITORY" --ref main
            exit 0
          fi
          if (( left > 0 )); then echo "$((left / 60))분 기다림"; sleep "$left"; fi
          state=$(ANY_BUSY=1 bash automation/monthly_due.sh)
          echo "이번 달 월간 갱신: $state" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$state" = due ] || exit 0
          gh workflow run monthly-update.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "월간 자동 갱신을 불렀어요 ($(date '+%m-%d %H:%M'))" | tee -a "$GITHUB_STEP_SUMMARY"
