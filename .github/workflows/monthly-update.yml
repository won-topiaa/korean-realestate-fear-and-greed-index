name: 월간 자동 갱신

# GitHub 예약 실행은 몇 시간 늦거나 아예 빠지기도 한다 (2026-10-20 본 실행이 빠짐). 그래서 예비 시각을 두고,
# 예약 실행은 먼저 'due'에서 이번 달 갱신이 이미 됐거나 먼저 시작한 갱신이 돌고 있으면 바로 끝낸다.
# 앞 실행이 실패했으면 예비 실행이 다시 시도하는 셈. 22일까지 안 되면 '원자료 캐시 유지'가 다시 실행하고 이슈로 알린다.
on:
  schedule:
    - cron: "17 0 20 * *"   # 본 실행: 매달 20일 00:17 UTC = 09:17 KST
    - cron: "43 6 20 * *"   # 예비: 20일 15:43 KST
    - cron: "43 12 20 * *"  # 예비: 20일 21:43 KST
    - cron: "43 0 21 * *"   # 예비: 21일 09:43 KST
    - cron: "43 0 22 * *"   # 예비: 22일 09:43 KST
  workflow_dispatch:         # Actions 탭에서 수동 실행 (확인 없이 바로 갱신)
    inputs:
      skip_fetch:
        description: "자료 받기 없이 재계산만 (지역 실거래 채우기가 끝났을 때 region-backfill.yml이 부름)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read   # due: 돌고 있는 갱신 확인
  issues: write   # 지역 엔진을 처음 고정했을 때 알림

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automation
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          state=$(bash automation/monthly_due.sh)
          echo "이번 달 갱신 상태: $state" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "go=$([ "$state" = due ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  update:
    needs: due
    if: needs.due.outputs.go == 'true'
    concurrency:  # '화면만 다시 배포'와 같은 묶음: 둘이 겹치지 않고 차례로 (배포·푸시 충돌 방지). 건너뛴 예비 실행은 묶음에 안 들어감
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Seoul   # 실행 기록 시간을 한국 시간으로
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: API 키 (.env는 저장소에 올라가지 않음)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          REB_KEY: ${{ secrets.REB_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: printf 'DATA_GO_KR_KEY=%s\nREB_KEY=%s\nECOS_KEY=%s\n' "$DATA_GO_KR_KEY" "$REB_KEY" "$ECOS_KEY" > .env

      - name: 지난달 원자료 캐시 (KB·주가는 저장소에 올리지 않음)
        uses: actions/cache@v4
        with:
          path: |
            data/raw/kb
            data/raw/market
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: 자료 갱신 → 재계산 → 점검 → 사이트 빌드
        run: python update_pipeline.py --no-publish ${{ inputs.skip_fetch && '--skip-fetch' || '' }}

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: logs/
          retention-days: 90

      - name: 실패하면 단계별 결과만 남기기 (원인 확인용, 키는 지운 상태)
        if: failure()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("results_zone/update_status.json"))
          print("| 단계 | 결과 | 내용 |\n|---|---|---|")
          for s in d["steps"]:
              print(f"| {s['step']} | {'OK' if s['ok'] else 'FAIL'} | {s['detail'][:200].replace('|', '/')} |")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_zone/update_status.json
          git diff --cached --quiet || git commit -m "월간 갱신 실패 기록 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase -X theirs origin main && git push origin HEAD:main || true

      - name: 갱신된 자료 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data results_zone results_v2 results_region map report home README.md
          git diff --cached --quiet || git commit -m "월간 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 실행 중에 누가 화면 등을 올렸으면: 그 위에 얹고(자료는 이번 실행 값 우선), 새 화면으로 다시 빌드
          git pull --rebase -X theirs origin main
          python map/build.py && python report/build.py && python home_build.py && python site_build.py
          git add -A map report home
          git diff --cached --quiet || git commit -m "화면 다시 빌드 (갱신 중 바뀐 화면 반영)"
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # 알림은 배포 뒤에 (이슈를 못 열어도 배포는 끝나게). 커밋이나 배포가 실패했어도 엔진을 고정했으면 알린다
      - name: 지역 엔진을 처음 고정했으면 이슈로 알림
        if: always() && hashFiles('results_region/engine_new.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "수도권·광역시 엔진 고정 ($(TZ=Asia/Seoul date +%Y-%m-%d))" \
            --body "@${{ github.repository_owner }} 7개 지역 실거래가 다 모여 미리 정한 규칙대로 지역 엔진을 고정했어요. 이 실행의 결과: ${{ job.status }} ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          $(cat results_region/engine_new.md)"

      - name: 수도권·광역시 계산이 실패했으면 이슈로 알림 (같은 이슈가 열려 있으면 댓글)
        if: always() && hashFiles('results_region/region_failed.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="수도권·광역시 계산 실패"
          body="@${{ github.repository_owner }} 서울은 정상 게시했고 수도권·광역시는 지난 결과를 그대로 보여 주고 있어요. ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          $(cat results_region/region_failed.md)"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
