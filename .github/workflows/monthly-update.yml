name: 월간 자동 갱신

on:
  schedule:
    - cron: "17 0 20 * *"   # 매달 20일 00:17 UTC = 09:17 KST
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:  # '화면만 다시 배포'와 같은 묶음: 둘이 겹치지 않고 차례로 (배포·푸시 충돌 방지)
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Seoul   # 실행 기록 시간을 한국 시간으로
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: API 키 (.env는 저장소에 올라가지 않음)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          REB_KEY: ${{ secrets.REB_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: printf 'DATA_GO_KR_KEY=%s\nREB_KEY=%s\nECOS_KEY=%s\n' "$DATA_GO_KR_KEY" "$REB_KEY" "$ECOS_KEY" > .env

      - name: 지난달 원자료 캐시 (KB·주가는 저장소에 올리지 않음)
        uses: actions/cache@v4
        with:
          path: |
            data/raw/kb
            data/raw/market
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: 자료 갱신 → 재계산 → 점검 → 사이트 빌드
        run: python update_pipeline.py --no-publish

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: logs/
          retention-days: 90

      - name: 실패하면 단계별 결과만 남기기 (원인 확인용, 키는 지운 상태)
        if: failure()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("results_zone/update_status.json"))
          print("| 단계 | 결과 | 내용 |\n|---|---|---|")
          for s in d["steps"]:
              print(f"| {s['step']} | {'OK' if s['ok'] else 'FAIL'} | {s['detail'][:200].replace('|', '/')} |")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_zone/update_status.json
          git diff --cached --quiet || git commit -m "월간 갱신 실패 기록 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase -X theirs origin main && git push origin HEAD:main || true

      - name: 갱신된 자료 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data results_zone results_v2 map report
          git diff --cached --quiet || git commit -m "월간 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 실행 중에 누가 화면 등을 올렸으면: 그 위에 얹고(자료는 이번 실행 값 우선), 새 화면으로 다시 빌드
          git pull --rebase -X theirs origin main
          python map/build.py && python report/build.py && python site_build.py
          git add -A map report
          git diff --cached --quiet || git commit -m "화면 다시 빌드 (갱신 중 바뀐 화면 반영)"
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
