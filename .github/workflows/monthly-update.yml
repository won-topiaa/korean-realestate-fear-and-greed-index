name: 월간 자동 갱신

on:
  schedule:
    - cron: "17 0 20 * *"   # 매달 20일 00:17 UTC = 09:17 KST
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Seoul   # 실행 기록 시간을 한국 시간으로
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: API 키 (.env는 저장소에 올라가지 않음)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          REB_KEY: ${{ secrets.REB_KEY }}
        run: printf 'DATA_GO_KR_KEY=%s\nREB_KEY=%s\n' "$DATA_GO_KR_KEY" "$REB_KEY" > .env

      - name: 지난달 원자료 캐시 (KB·주가는 저장소에 올리지 않음)
        uses: actions/cache@v4
        with:
          path: |
            data/raw/kb
            data/raw/market
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: 자료 갱신 → v3.1 재계산 → 사이트 빌드
        run: python update_pipeline.py --no-publish

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: logs/
          retention-days: 90

      - name: 갱신된 자료 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data results_zone results_v2 map report
          git diff --cached --quiet || git commit -m "월간 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
