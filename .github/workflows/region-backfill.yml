name: 지역 실거래 채우기

# 수도권·광역시 자료를 처음 채운다 (하루 호출 한도가 있어 며칠에 나눠서, 맥 없이). 할 일이 없으면 1~2분 안에 끝난다.
#  - 실거래 (2006년부터): 받은 만큼 data/molit_kr/partial/에 커밋하고 다음 날 이어받는다 (region_backfill.py)
#  - 단지 이름: 이름을 남기기 전에 받은 거래의 단지는 그 단지가 거래된 달을 다시 받아 채운다 (같은 스크립트, 실거래가 다 찬 뒤)
#  - 건축물대장 (세대수·용적률 등, 실거래와 다른 호출 한도): 따로 동시에 (bldg_fetch.py --regions)
# 7개 지역 실거래가 다 차면 '월간 자동 갱신'을 자료 받기 없이 불러 지역 엔진을 고정하고 사이트에 반영한다.
# 그 갱신이 실패해 엔진이 아직 임시면 다음 차례에 다시 부른다. 단지 이름·정보가 새로 다 차면 '화면만 다시 배포'를 부른다.
# 월간 갱신을 앞뒀거나 아직 못 끝낸 날(KST 18~22일)은 채우기를 쉰다 (그날 호출 한도를 월간 갱신이 다 쓰게).
on:
  schedule:
    - cron: "23 15 * * *"   # 00:23 KST (한도가 풀린 직후)
    - cron: "47 18 * * *"   # 03:47 KST (앞 예약이 빠졌을 때: 2026-10-21 00:23 실행이 안 떴음)
    - cron: "23 21 * * *"   # 06:23 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 월간 자동 갱신·화면 배포 부르기

concurrency:
  group: region-backfill
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      left: ${{ steps.c.outputs.left }}
      names: ${{ steps.c.outputs.names }}
      bldg: ${{ steps.c.outputs.bldg }}
      fix: ${{ steps.c.outputs.fix }}
      busy: ${{ steps.c.outputs.busy }}
      weekly: ${{ steps.c.outputs.weekly }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 남은 일
        id: c
        run: python automation/backfill_left.py | tee -a "$GITHUB_OUTPUT"

  fill:
    needs: check
    # 월간 갱신 무렵(busy)엔 쉰다: 실행마다 한도를 나눠도 하루 세 번 돌면 월간 갱신 몫까지 써 버려서 (2026-10-22 건축물대장 한도 소진)
    # 월·화요일에 이번 주 실거래 주간 갱신이 아직이면(weekly) 실거래 채우기도 쉰다: 같은 실거래 API 하루 한도를 주간 갱신에 남긴다
    if: needs.check.outputs.busy != 'true' && needs.check.outputs.weekly != 'true' && (needs.check.outputs.left != '' || needs.check.outputs.names != '0')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 실거래·단지 이름 받기 (한도·시간 한도까지)
        id: fill
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          printf 'DATA_GO_KR_KEY=%s\n' "$DATA_GO_KR_KEY" > .env
          set +e
          # 재시도가 길어져도 작업 한도(340분) 안에서 저장·커밋
          python region_backfill.py --minutes 280
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 3 ]

      - name: 받은 만큼 커밋
        if: always()
        run: |
          rm -f .env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/molit_kr
          git diff --cached --quiet && exit 0
          git commit -m "지역 실거래 채우기 $(date +%Y-%m-%d) ($([ '${{ steps.fill.outputs.code }}' = 0 ] && echo 완료 || echo 진행 중))"
          bash automation/push.sh  # 건축물대장 작업·월간 갱신과 동시에 올릴 수 있어 밀리면 다시 (겹친 단지 표는 단지 번호로 합침)

  bldg:
    needs: check
    if: needs.check.outputs.busy != 'true' && needs.check.outputs.bldg != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 지역 건축물대장 (지번으로 → 못 찾으면 이름으로, 한도·시간 한도까지)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          printf 'DATA_GO_KR_KEY=%s\n' "$DATA_GO_KR_KEY" > .env
          python bldg_fetch.py run --regions --minutes 70
          python bldg_fetch.py fill --regions --minutes 30
          python bldg_fetch.py land --regions --minutes 10   # 대장에 대지가 있는 단지의 용적률·건폐율 (토지대장은 키가 없어 건너뜀)

      - name: 받은 만큼 커밋
        if: always()
        run: |
          rm -f .env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/molit_kr/buildings.csv
          git diff --cached --quiet && exit 0
          git commit -m "지역 건축물대장 채우기 $(date +%Y-%m-%d)"
          bash automation/push.sh  # 실거래 작업·월간 갱신과 동시에 올릴 수 있어 밀리면 다시 (겹친 단지 표는 단지 번호로 합침)

  finish:
    needs: [check, fill, bldg]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 위 작업들이 올린 뒤의 main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 다시 확인
        id: after
        run: python automation/backfill_left.py | tee -a "$GITHUB_OUTPUT"

      - name: 실거래가 다 찼으면 월간 자동 갱신 부르기 (자료 받기 없이 → 엔진 고정·사이트 반영)
        id: monthly
        if: steps.after.outputs.left == '' && (needs.check.outputs.left != '' || steps.after.outputs.fix == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/monthly-update.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$busy" != 0 ]; then echo "월간 자동 갱신이 돌고 있어 다음 차례에 다시 확인"; exit 0; fi
          gh workflow run monthly-update.yml -R "$GITHUB_REPOSITORY" --ref main -f skip_fetch=true
          echo "called=true" >> "$GITHUB_OUTPUT"

      # 단지 검색·신고가·모의 투자 자료는 사이트를 만들 때 계산하므로, 새로 다 찬 지역 자료를 화면에 올린다 (월간 갱신을 불렀으면 거기서)
      - name: 단지 이름·정보가 새로 다 찼으면 화면 다시 배포
        if: steps.monthly.outputs.called != 'true' && ((needs.check.outputs.names != '0' && steps.after.outputs.names == '0') || (needs.check.outputs.bldg != '0' && steps.after.outputs.bldg == '0') || (needs.check.outputs.left != steps.after.outputs.left))
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-deploy.yml -R "$GITHUB_REPOSITORY" --ref main
