name: 화면만 다시 배포

# 첫 화면·지도·보고서·단지 검색 화면(template.html)을 고치면 자료 갱신 없이 사이트만 다시 만들어 배포한다.
# 단지 검색 자료(results_apt)는 저장소에 올리지 않으므로 여기서 저장소의 실거래 자료로 다시 계산한다 (1분 안쪽).
# (월간 자동 갱신의 봇 커밋은 GITHUB_TOKEN으로 올라가서 이 워크플로를 다시 부르지 않는다)
on:
  push:
    branches: [main]
    paths:
      - "map/template.html"
      - "map/build.py"
      - "report/template.html"
      - "report/build.py"
      - "site_build.py"
      - "apt/template.html"
      - "apt_score.py"
      - "assets/**"
      - "highs/**"
      - "sim/**"
      - "highs_build.py"
      - "sim_build.py"
      - "api/**"
      - "api_build.py"
      - "home/template.html"
      - "home_build.py"
      - "regions.py"
      - "data/korea_map.json"
      - "data/region_maps/**"
      - "results_region/*.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:  # 월간 자동 갱신과 같은 묶음: 갱신이 끝난 뒤 차례로 돈다
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # 이 푸시 시점이 아니라 지금의 main (기다리는 동안 갱신 커밋이 들어왔을 수 있음)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지 설치 (단지 검색 계산용)
        run: pip install -r requirements.txt
      - name: 저장소에 있는 최신 결과로 지도·보고서·단지 검색·사이트 만들기
        run: |
          python map/build.py
          python report/build.py
          python apt_score.py
          python highs_build.py
          python sim_build.py
          python home_build.py
          python site_build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
