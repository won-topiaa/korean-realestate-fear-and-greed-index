name: 화면만 다시 배포

# 지도·보고서 화면(template.html)을 고치면 자료 갱신 없이 사이트만 다시 만들어 배포한다.
# (월간 자동 갱신의 봇 커밋은 GITHUB_TOKEN으로 올라가서 이 워크플로를 다시 부르지 않는다)
on:
  push:
    branches: [main]
    paths:
      - "map/template.html"
      - "map/build.py"
      - "report/template.html"
      - "report/build.py"
      - "site_build.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 저장소에 있는 최신 결과로 지도·보고서·사이트 만들기
        run: |
          python map/build.py
          python report/build.py
          python site_build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
