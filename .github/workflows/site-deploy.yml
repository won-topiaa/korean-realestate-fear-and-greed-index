name: 화면만 다시 배포

# 첫 화면·지도·보고서·단지 검색 화면(template.html)을 고치면 자료 갱신 없이 사이트만 다시 만들어 배포한다.
# 단지 검색·신고가·모의 투자 자료(results_apt 등)는 저장소에 올리지 않으므로 여기서 저장소의 실거래 자료로 서울과 지역마다
# 다시 계산한다 (셋을 동시에, 몇 분). 서울 밖 한 지역만 실패하면 그 지역은 빼고 배포한다 (종료 코드 2).
# (월간 자동 갱신의 봇 커밋은 GITHUB_TOKEN으로 올라가서 이 워크플로를 다시 부르지 않는다.
#  지역 자료 채우기가 단지 이름·정보를 다 채우면 workflow_dispatch로 이 워크플로를 부른다)
on:
  push:
    branches: [main]
    paths:
      - "map/template.html"
      - "map/build.py"
      - "report/template.html"
      - "report/build.py"
      - "site_build.py"
      - "apt/template.html"
      - "apt_score.py"
      - "data/apt_params.json"
      - "assets/**"
      - "highs/**"
      - "sim/**"
      - "highs_build.py"
      - "sim_build.py"
      - "api/**"
      - "api_build.py"
      - "home/template.html"
      - "home_build.py"
      - "regions.py"
      - "data/korea_map.json"
      - "data/region_maps/**"
      - "results_region/*.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # 월간 자동 갱신이 돌고 있는지 확인

jobs:
  # 월간 자동 갱신이 돌거나 기다리는 중이면 끝날 때까지 기다렸다가 배포한다. 같은 묶음(pages)에서 기다리는 작업은 하나만 남고
  # 새 작업이 옛 작업을 취소하므로, 갱신이 도는 동안 묶음에 들어가면 기다리던 월간 갱신이 취소될 수 있어 묶음 밖에서 기다린다.
  # (예전엔 바로 비켜 주고 갱신이 끝날 때 다시 부르길 기대했는데, 갱신이 실패하거나 몇 초짜리 예비 실행과 겹치면 배포가 사라졌음)
  yield:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy() { gh api "repos/$GITHUB_REPOSITORY/actions/workflows/monthly-update.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length'; }
          t0=$(date +%s)
          while :; do
            n=$(busy 2>/dev/null || echo "?")  # 목록을 잠깐 못 읽으면 기다렸다가 다시
            [ "$n" = 0 ] && break
            if (( $(date +%s) - t0 > 185 * 60 )); then  # 갱신(최대 150분)보다 오래면 포기 (갱신이 끝나며 최신 화면을 배포함)
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "월간 자동 갱신이 너무 오래 돌아 배포를 건너뜀" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "월간 자동 갱신이 돌고 있어 기다림 ($n)"; sleep 60
          done
          echo "go=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: yield
    if: needs.yield.outputs.go == 'true'
    concurrency:  # 화면 배포끼리는 차례로
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # 이 푸시 시점이 아니라 지금의 main (기다리는 동안 갱신 커밋이 들어왔을 수 있음)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지 설치 (단지 검색 계산용)
        run: pip install -r requirements.txt
      - name: 저장소에 있는 최신 결과로 지도·보고서·단지 검색·사이트 만들기
        run: |
          python map/build.py
          python report/build.py
          python apt_region_study.py --missing || true  # 새로 들어온 지역의 단지 점수 고정값 (월간 갱신이 커밋)
          ok() { [ "$1" = 0 ] || [ "$1" = 2 ]; }  # 2 = 서울 밖 일부 지역만 실패 (그 지역은 빼고 배포)
          python apt_score.py > apt.log 2>&1 & a=$!
          python highs_build.py > highs.log 2>&1 & h=$!
          python sim_build.py > sim.log 2>&1 & s=$!
          set +e; wait $a; ca=$?; wait $h; ch=$?; wait $s; cs=$?; set -e
          cat apt.log highs.log sim.log
          # 셋 중 하나라도 실패하면 배포하지 않는다 (지금 사이트를 그대로 둠). 예전엔 && 줄이라 앞의 둘이 실패해도 배포됐음
          ok $ca || { echo "단지 검색 계산 실패 (apt_score.py)"; exit 1; }
          ok $ch || { echo "신고가 계산 실패 (highs_build.py)"; exit 1; }
          ok $cs || { echo "모의 투자 계산 실패 (sim_build.py)"; exit 1; }
          python home_build.py
          python site_build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
