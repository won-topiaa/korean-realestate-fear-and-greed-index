name: 주간 갱신 (실거래·신고가 · 주간 소식)

# 매주 월요일 아침: 지수와 엮은 주간 소식을 정리하고(news_build.py), 최근 3개 계약월의 서울·수도권·광역시 실거래를 다시 받아
# (weekly_trades.py) 올린 뒤 '화면만 다시 배포'를 불러 단지 검색·신고가·모의 투자와 주간 소식 화면을 새로 만든다.
# 지수는 그대로 매달 20일(월간 자동 갱신). 월간 갱신 무렵(KST 18~22일, 아직 안 끝났을 때)이나 월간 갱신이 도는 중에는 실거래 받기를 쉰다.
#
# 꼭 돌게: GitHub 예약은 몇 시간 늦거나 빠지므로(2026-10-20·21) 월·화요일에 예비 예약을 여러 개 둔다. 매번 먼저
# automation/weekly_due.py로 이번 주 할 일을 보고, 끝난 일은 건너뛴다 (실거래: data/weekly_state.json, 소식: data/news의 이번 주 호,
# 배포: 사이트의 status.json이 저장소와 같은지). 그래서 앞 실행이 실패·일부 실패했거나 배포가 빠졌으면 다음 예비 실행이 그 부분만 다시 한다.
# 소식을 먼저 해서(1분) 실거래 서버가 늘어져도 소식은 나가고, 실거래는 시간 한도(weekly_trades.BUDGET)를 넘기면 끊고 다음 예비 실행에 맡긴다.
# 배포를 부른 뒤에는 사이트에 실제로 올라갔는지 확인하고, 안 올라갔으면 실패로 남긴다 (다음 예비 실행이 다시 부름).
# 마지막 예비 실행(화요일 오후)까지 안 되면 이슈로 알리고, 다음에 성공하면 닫는다. GitHub 밖에서는 Worker의 매일 감시가 메일로 알린다.
on:
  schedule:
    - cron: "7 21 * * 0"    # 월요일 06:07 KST
    - cron: "37 1 * * 1"    # 예비: 월요일 10:37 KST
    - cron: "7 6 * * 1"     # 예비: 월요일 15:07 KST
    - cron: "37 12 * * 1"   # 예비: 월요일 21:37 KST
    - cron: "7 22 * * 1"    # 예비: 화요일 07:07 KST
    - cron: "37 4 * * 2"    # 예비: 화요일 13:37 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 화면 배포 부르기
  issues: write    # 끝내 안 되면 알림

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 이번 주 할 일 확인
        id: due
        run: |
          out=$(python3 automation/weekly_due.py)  # 실패하면 여기서 멈춤 (할 일이 없는 것처럼 지나가지 않게)
          # 월간 갱신이 도는 중이면 실거래는 쉰다: 같은 실거래 파일을 두 작업이 고쳐 올리면 나중 쪽이 못 올림
          busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/monthly-update.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          if [ "$busy" != 0 ] && grep -qx "trades=due" <<< "$out"; then
            out=$(sed 's/^trades=due$/trades=wait/' <<< "$out")
            echo "월간 갱신이 도는 중이라 실거래는 다음 예비 실행에 받아요"
          fi
          tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<< "$out"

      - name: 주간 소식 정리
        id: news
        if: steps.due.outputs.news == 'due'
        continue-on-error: true
        run: python3 news_build.py

      - uses: actions/setup-python@v5
        if: steps.due.outputs.trades == 'due'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.due.outputs.trades == 'due'
        run: pip install -r requirements.txt

      - name: 실거래 받기 (이번 달과 지난 두 달)
        id: trades
        if: steps.due.outputs.trades == 'due'
        continue-on-error: true
        timeout-minutes: 55   # 안쪽 시간 한도(서울 15분·지역 30분)가 못 끊었을 때의 마지막 안전판
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PYTHONUNBUFFERED: "1"   # 진행 줄이 바로 보이게
        run: |
          printf 'DATA_GO_KR_KEY=%s\n' "$DATA_GO_KR_KEY" > .env
          set +e
          python weekly_trades.py
          code=$?
          set -e
          rm -f .env
          [ "$code" != 1 ]   # 1 = 서울·지역 모두 못 받음 (2 = 월간 갱신 무렵이라 쉼)

      - name: 올리기
        id: push
        if: steps.due.outputs.trades == 'due' || steps.due.outputs.news == 'due'
        run: |
          rm -f .env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/molit data/molit_kr data/news $(ls data/weekly_state.json 2>/dev/null)
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "주간 갱신 $(date +%Y-%m-%d) (실거래·주간 소식)"
          bash automation/push.sh  # 다른 작업과 겹치면 얹어서 (단지 표는 단지 번호로 합침)
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 화면 배포 부르기
        id: deploy
        if: steps.push.outputs.changed == 'true' || steps.due.outputs.deploy == 'need'
        run: |
          for i in 1 2 3 4; do  # 부르기가 잠깐 실패해도 다시
            gh workflow run site-deploy.yml -R "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep $((i * 20))
          done
          exit 1

      - name: 사이트에 올라갔는지 확인
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          set -o pipefail
          # 월간 갱신이 도는 중이면 화면 배포가 그 뒤로 미뤄지므로 (몇 시간) 확인하지 않는다: 월간 갱신이 끝나며 최신 화면을 배포한다
          busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/monthly-update.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          if [ "$busy" != 0 ]; then echo "월간 갱신이 도는 중이라 배포 확인은 건너뜀" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python3 automation/weekly_due.py verify 50 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 실패한 쪽이 있으면 실패로 남기기
        if: always() && (job.status == 'failure' || steps.trades.outcome == 'failure' || steps.news.outcome == 'failure')
        run: |
          msg="실거래: ${{ steps.trades.outcome || '할 일 없음' }} · 주간 소식: ${{ steps.news.outcome || '할 일 없음' }} · 올리기: ${{ steps.push.outcome || '-' }} · 배포: ${{ steps.deploy.outcome || '-' }} · 확인: ${{ steps.verify.outcome || '-' }}"
          echo "$msg · 다음 예비 실행이 못 한 부분만 다시 해요." >> "$GITHUB_STEP_SUMMARY"
          # 이번 주 마지막 예비 실행(화요일 13:37) 뒤나 손으로 돌린 실행이면 이슈로 알림 (그 전엔 예비 실행이 다시 함)
          dow=$(date +%u); hr=$(date +%H)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$dow" -ge 3 ] || { [ "$dow" = 2 ] && [ "$((10#$hr))" -ge 13 ]; }; then
            bash automation/issue.sh open "주간 갱신 확인 필요" "$(date +%m-%d) $msg — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (Actions → 주간 갱신 → Run workflow로 다시 돌리면 못 한 일만 해요)"
          fi
          exit 1

      - name: 다 됐으면 알림 이슈 닫기
        if: success() && steps.trades.outcome != 'failure' && steps.news.outcome != 'failure'
        run: bash automation/issue.sh close "주간 갱신 확인 필요" "$(date +%m-%d) 주간 갱신이 끝났어요 (자동으로 닫음)"
